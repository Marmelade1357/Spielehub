worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Für den WebSocket-Upgrade (Socket.IO) muss der "Connection"-Header nur bei
    # einem tatsächlichen Upgrade-Request auf "upgrade" gesetzt werden, sonst auf
    # "close" - sonst brechen normale HTTP-Requests durch den Proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8094;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        # "Der Widerstand" - läuft als eigener Container auf 127.0.0.1:8092.
        # Trailing Slash bei location UND proxy_pass sorgt dafür, dass nginx
        # das Präfix "/widerstand" abschneidet, bevor die Anfrage weitergeht -
        # der Widerstand-Server selbst weiß nichts von diesem Unterpfad.
        location = /widerstand { return 301 /widerstand/; }
        location /widerstand/ {
            proxy_pass http://127.0.0.1:8092/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # "Wizard" - läuft als eigener Container auf 127.0.0.1:8093.
        location = /wizard { return 301 /wizard/; }
        location /wizard/ {
            proxy_pass http://127.0.0.1:8093/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # "Bluff" (Lügen) - läuft als eigener Container auf 127.0.0.1:8095.
        location = /bluff { return 301 /bluff/; }
        location /bluff/ {
            proxy_pass http://127.0.0.1:8095/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # "Tempel des Schreckens" - läuft als eigener Container auf 127.0.0.1:8096.
        location = /tempel { return 301 /tempel/; }
        location /tempel/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # "Poker" - läuft als eigener Container auf 127.0.0.1:8097.
        location = /poker { return 301 /poker/; }
        location /poker/ {
            proxy_pass http://127.0.0.1:8097/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # "Munchkin" - läuft als eigener Container auf 127.0.0.1:8098.
        location = /munchkin { return 301 /munchkin/; }
        location /munchkin/ {
            proxy_pass http://127.0.0.1:8098/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
