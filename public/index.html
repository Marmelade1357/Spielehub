<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spieleabend</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #100b1e;
    --bg-alt: #180f2b;
    --panel: #1e1436;
    --border: #3a2b5c;
    --text: #ece7f6;
    --text-dim: #a99bc9;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at top, #241a40 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
  }

  .hub-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 30px;
    width: 100%;
    max-width: 760px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    text-align: center;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 2.1rem;
    text-shadow: 0 0 18px rgba(124,77,255,0.6);
  }
  .subtitle { color: var(--text-dim); margin: 0 0 30px; }

  .games { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  .game-tile {
    flex: 1 1 260px;
    max-width: 320px;
    background: var(--bg-alt);
    border: 1px solid var(--tile-border);
    border-radius: 12px;
    padding: 26px 22px 22px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.15s ease, filter 0.15s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .game-tile:hover { transform: translateY(-4px); filter: brightness(1.1); }
  .game-tile .icon {
    font-size: 2.6rem;
    display: block;
    margin-bottom: 10px;
    text-shadow: 0 0 14px var(--tile-glow);
  }
  .game-tile h2 { margin: 0 0 8px; font-size: 1.25rem; }
  .game-tile p { margin: 0 0 20px; color: var(--text-dim); font-size: 0.88rem; line-height: 1.4; flex-grow: 1; }

  .play-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 11px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    color: white;
    background: var(--tile-btn);
  }

  .game-tile.widerstand { --tile-border: #5a2a2a; --tile-glow: rgba(231,76,60,0.55); --tile-btn: linear-gradient(135deg, #e74c3c, #c0392b); }
  .game-tile.wizard { --tile-border: #6b4a1f; --tile-glow: rgba(124,77,255,0.55); --tile-btn: linear-gradient(135deg, #7c4dff, #5a2fe0); }

  footer { margin-top: 30px; color: var(--text-dim); font-size: 0.78rem; }
</style>
</head>
<body>
  <div class="hub-card">
    <h1>🎲 Spieleabend</h1>
    <p class="subtitle">Welches Spiel wollt ihr spielen?</p>
    <div class="games">
      <a class="game-tile widerstand" href="/widerstand/">
        <span class="icon">🕵️</span>
        <h2>Der Widerstand</h2>
        <p>Geheime Rollen, Teams vorschlagen, Missionen sabotieren. 5–10 Spieler.</p>
        <span class="play-btn">Spielen</span>
      </a>
      <a class="game-tile wizard" href="/wizard/">
        <span class="icon">🧙</span>
        <h2>Wizard</h2>
        <p>Sag genau vorher, wie viele Stiche du machst. 3–6 Spieler.</p>
        <span class="play-btn">Spielen</span>
      </a>
    </div>
    <footer>Ein Gerät pro Person – einfach den Link mit Freunden teilen.</footer>
  </div>
</body>
</html>
